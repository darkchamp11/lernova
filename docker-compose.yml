version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lernova-app
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/lernova
      - REDIS_URL=redis://cache:6379
      - NODE_ENV=development
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - SESSION_SECRET=dev-secret-key-change-in-production
      - SESSION_DURATION=86400
    depends_on:
      cache:
        condition: service_started
    networks:
      - lernova-network
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next


  cache:
    image: redis:7-alpine
    container_name: lernova-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - lernova-network
    command: redis-server --appendonly yes

volumes:
  redis_data:

networks:
  lernova-network:
    driver: bridge
